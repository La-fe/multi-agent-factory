<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .app {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    .app-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 28px 24px 20px;
      color: #fff;
    }

    .app-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .remaining {
      margin-top: 4px;
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .add-form {
      display: flex;
      gap: 8px;
      padding: 20px 24px;
      border-bottom: 1px solid #f0f0f0;
    }

    .add-input {
      flex: 1;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .add-input:focus { border-color: #667eea; }

    .add-btn {
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .add-btn:hover { background: #5a6fd6; }
    .add-btn:active { background: #4f61c9; }

    .todo-list {
      list-style: none;
      padding: 8px 0;
      min-height: 40px;
    }

    .empty-state {
      padding: 32px 24px;
      text-align: center;
      color: #bbb;
      font-size: 0.9rem;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      transition: background 0.1s;
    }

    .todo-item:hover { background: #fafafa; }

    .todo-check {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #d0d0d0;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }

    .todo-check:checked {
      background: #667eea;
      border-color: #667eea;
    }

    .todo-check:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .todo-text {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
      word-break: break-word;
      transition: color 0.15s;
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #bbb;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px;
      border-radius: 4px;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }

    .delete-btn:hover { color: #e53e3e; background: #fff5f5; }

    .app-footer {
      padding: 14px 24px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }

    .clear-btn:hover { color: #e53e3e; background: #fff5f5; }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-header">
      <h1>Todo List</h1>
      <p class="remaining" id="remaining">0 items remaining</p>
    </div>

    <form class="add-form" id="add-form">
      <input
        class="add-input"
        id="add-input"
        type="text"
        placeholder="Add a new todo…"
        autocomplete="off"
        maxlength="200"
      >
      <button class="add-btn" type="submit">Add</button>
    </form>

    <ul class="todo-list" id="todo-list"></ul>

    <div class="app-footer">
      <button class="clear-btn" id="clear-btn">Clear completed</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'maf-todos-v1';

    // --- State ---
    let todos = load();

    // --- Persistence ---
    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // --- Render ---
    function render() {
      const list = document.getElementById('todo-list');
      const remaining = todos.filter(t => !t.done).length;

      document.getElementById('remaining').textContent =
        `${remaining} item${remaining !== 1 ? 's' : ''} remaining`;

      if (todos.length === 0) {
        list.innerHTML = '<li class="empty-state">No todos yet — add one above!</li>';
        return;
      }

      list.innerHTML = todos.map((todo, i) => `
        <li class="todo-item${todo.done ? ' done' : ''}" data-index="${i}">
          <input
            class="todo-check"
            type="checkbox"
            ${todo.done ? 'checked' : ''}
            aria-label="Toggle ${escHtml(todo.text)}"
          >
          <span class="todo-text">${escHtml(todo.text)}</span>
          <button class="delete-btn" aria-label="Delete ${escHtml(todo.text)}">&#x2715;</button>
        </li>
      `).join('');
    }

    function escHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // --- Events ---
    document.getElementById('add-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('add-input');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      save();
      render();
      input.value = '';
      input.focus();
    });

    document.getElementById('todo-list').addEventListener('click', e => {
      const item = e.target.closest('[data-index]');
      if (!item) return;
      const i = Number(item.dataset.index);

      if (e.target.classList.contains('todo-check')) {
        todos[i].done = e.target.checked;
        save();
        render();
      } else if (e.target.classList.contains('delete-btn')) {
        todos.splice(i, 1);
        save();
        render();
      }
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      save();
      render();
    });

    // --- Init ---
    render();
  </script>
</body>
</html>
