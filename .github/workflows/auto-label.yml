name: PR Size Labels

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-size:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by size
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            // Exclude lockfiles and docs from size calculation (OpenClaw pattern)
            const excludedFiles = new Set([
              'pnpm-lock.yaml', 'package-lock.json', 'yarn.lock', 'bun.lockb'
            ]);
            const total = files.reduce((sum, file) => {
              const path = file.filename ?? '';
              if (excludedFiles.has(path) || path.startsWith('docs/')) {
                return sum;
              }
              return sum + (file.additions ?? 0) + (file.deletions ?? 0);
            }, 0);

            const sizeLabels = {
              'size/XS': total <= 10,
              'size/S':  total > 10  && total <= 50,
              'size/M':  total > 50  && total <= 200,
              'size/L':  total > 200 && total <= 500,
              'size/XL': total > 500,
            };

            const newLabel = Object.entries(sizeLabels).find(([, match]) => match)?.[0];
            if (!newLabel) return;

            const allSizeLabels = Object.keys(sizeLabels);

            // Remove old size labels
            const currentLabels = context.payload.pull_request.labels.map(l => l.name);
            for (const label of currentLabels) {
              if (allSizeLabels.includes(label) && label !== newLabel) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
              }
            }

            // Add new size label
            if (!currentLabels.includes(newLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [newLabel],
              });
            }
